name: Repository checks
# Checks that need no model checker: files parse, links resolve, every model
# case has an expected outcome, and the judge never turns an unfinished run
# into a match. Runs on all three platforms dodona supports.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            python: python3
          - os: ubuntu-latest
            python: python3
          - os: windows-latest
            python: python
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Run repository checks
        run: ${{ matrix.python }} tools/check_repo.py
