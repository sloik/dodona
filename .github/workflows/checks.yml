name: Repository checks
# Checks that need no model checker: files parse, links resolve, every model
# case has an expected outcome, and the judge never turns an unfinished run
# into a match. It also builds the seed kernel and judges it with the conformance
# kit. Runs on all three platforms dodona supports.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    if: github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/dodona-eight-40-c37-run-proof'
    # The name is the system alone, not the runner's version: main's ruleset requires these
    # checks by name, and a runner bump must not rename a required check.
    name: checks (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            system: macos
            python: python3
            rust_kernel: kernel/target/release/dodona-kernel
          - os: ubuntu-26.04
            system: linux
            python: python3
            rust_kernel: kernel/target/release/dodona-kernel
          # The file's own name: a case started in the project's folder turns the command's paths absolute only if
          # they name a file, and on Windows the built file ends in .exe.
          - os: windows-2025
            system: windows
            python: python
            rust_kernel: kernel/target/release/dodona-kernel.exe
    runs-on: ${{ matrix.os }}
    # The run itself takes seconds. The allowance is for waiting on a hosted
    # machine, which for macOS can be long.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run repository checks
        run: ${{ matrix.python }} tools/check_repo.py
      - name: Plant a fault for every document check, and judge a throwaway repository through git
        shell: bash
        run: |
          # Outside the checkout: files inside it would be files the documents must account for.
          V="$RUNNER_TEMP/venv-yaml"
          ${{ matrix.python }} -m venv "$V"
          if [ -x "$V/bin/python" ]; then P="$V/bin/python"; else P="$V/Scripts/python.exe"; fi
          "$P" -m pip install --quiet --no-index --no-deps --require-hashes -r .github/yaml-reader.txt
          "$P" -I tools/check_docs.py self-test
      - name: Validate schemas, guide examples and policy with a JSON Schema validator
        if: matrix.os == 'ubuntu-26.04'
        run: |
          python3 -m venv .venv-examples
          .venv-examples/bin/python -m pip install --quiet jsonschema==4.26.0
          .venv-examples/bin/python tools/check_examples.py
          .venv-examples/bin/python tools/policy_input.py --self-test
      - name: Test this site's batch executor for a kernel's run, against a fake queue
        run: ${{ matrix.python }} .github/site/test_kernel_executor.py
      - name: Judge the reference host with the misbehaving provider
        run: ${{ matrix.python }} tools/run_provider_cases.py -- ${{ matrix.python }} tools/provider_host.py
      - name: Judge the stage-0 host with a checker that breaks one rule at a time
        run: ${{ matrix.python }} tools/run_check_cases.py -- ${{ matrix.python }} tools/host.py check
      - name: The intents provider answers what the stage-0 helper reads (decision 0034)
        run: ${{ matrix.python }} tools/check_intents_provider.py
      - name: Build the seed kernel
        id: build_seed
        run: cargo build --release --locked --manifest-path kernel/Cargo.toml
      - name: Judge the reference status command with the project cases (decision 0034)
        run: ${{ matrix.python }} tools/run_status_cases.py --kernel kernel/target/release/dodona-kernel -- ${{ matrix.python }} tools/project_status.py --kernel kernel/target/release/dodona-kernel
      - name: Kernel unit tests
        run: cargo test --locked --manifest-path kernel/Cargo.toml
      - name: Judge the kernel with the conformance kit
        run: ${{ matrix.python }} tools/run_kit.py -- kernel/target/release/dodona-kernel scenario
      - name: Judge the kernel with the encoding vectors
        run: ${{ matrix.python }} tools/run_vectors.py -- kernel/target/release/dodona-kernel canonical
      - name: Judge the kernel with the path vectors
        run: ${{ matrix.python }} tools/run_path_vectors.py -- kernel/target/release/dodona-kernel path path-set
      - name: Judge the kernel with the core-key vectors
        run: ${{ matrix.python }} tools/run_key_vectors.py -- kernel/target/release/dodona-kernel key
      - name: Judge the kernel's ledger, with damage at every byte and two writers at once
        run: ${{ matrix.python }} tools/run_ledger_cases.py -- kernel/target/release/dodona-kernel
      - name: Check the kernel against values the reference signer makes now
        run: ${{ matrix.python }} tools/run_attest_check.py -- kernel/target/release/dodona-kernel scenario
      - name: Status of this project from an empty ledger, and the confirmation command refusing without a terminal
        if: matrix.os == 'ubuntu-26.04'
        run: |
          git fetch --quiet --depth 1 origin main
          python3 tools/status.py --ledger out/empty.ledger --writer ci --kernel kernel/target/release/dodona-kernel
          set +e; python3 tools/confirm.py --intent 0002 --kernel kernel/target/release/dodona-kernel < /dev/null; code=$?; set -e
          test "$code" = 2
      - name: Judge how strictly the kernel reads its input
        run: ${{ matrix.python }} tools/run_input_cases.py -- kernel/target/release/dodona-kernel
      - name: Run the reference harness on a real checker and have the kernel grade what it signs
        run: ${{ matrix.python }} tools/run_harness_check.py -- kernel/target/release/dodona-kernel scenario
      - name: Judge the kernel as the host of a provider session (decision 0033)
        run: ${{ matrix.python }} tools/run_provider_cases.py -- kernel/target/release/dodona-kernel session
      - name: Judge the kernel as the host of a check, against the misbehaving checker (decision 0033)
        run: ${{ matrix.python }} tools/run_check_cases.py -- kernel/target/release/dodona-kernel check
      - name: Compare the kernel's path check with the reference on random paths
        run: ${{ matrix.python }} tools/path_differential.py -- kernel/target/release/dodona-kernel
      # The second kernel: JavaScript, written without sight of the first.
      - name: Second kernel, unit tests
        run: node --test kernel2/test.js
      - name: Judge the second kernel with the conformance kit
        run: ${{ matrix.python }} tools/run_kit.py -- node kernel2/dodona-kernel2.js scenario
      - name: Judge the second kernel with the encoding vectors
        run: ${{ matrix.python }} tools/run_vectors.py -- node kernel2/dodona-kernel2.js canonical
      - name: Judge the second kernel with the path vectors
        run: ${{ matrix.python }} tools/run_path_vectors.py -- node kernel2/dodona-kernel2.js path path-set
      - name: Judge the second kernel with the core-key vectors
        run: ${{ matrix.python }} tools/run_key_vectors.py -- node kernel2/dodona-kernel2.js key
      - name: Judge the second kernel's ledger
        run: ${{ matrix.python }} tools/run_ledger_cases.py -- node kernel2/dodona-kernel2.js
      - name: Check the second kernel against values the reference signer makes now
        run: ${{ matrix.python }} tools/run_attest_check.py -- node kernel2/dodona-kernel2.js scenario
      - name: Judge how strictly the second kernel reads its input
        run: ${{ matrix.python }} tools/run_input_cases.py -- node kernel2/dodona-kernel2.js
      - name: Run the reference harness and have the second kernel grade what it signs
        run: ${{ matrix.python }} tools/run_harness_check.py -- node kernel2/dodona-kernel2.js scenario
      - name: Judge the second kernel as the host of a provider session (decision 0033)
        run: ${{ matrix.python }} tools/run_provider_cases.py -- node kernel2/dodona-kernel2.js session
      - name: Judge the second kernel as the host of a check, against the misbehaving checker (decision 0033)
        run: ${{ matrix.python }} tools/run_check_cases.py -- node kernel2/dodona-kernel2.js check
      - name: Compare the two kernels on inputs the kit does not contain
        run: ${{ matrix.python }} tools/kernel_differential.py --rounds 8 --a kernel/target/release/dodona-kernel --b node kernel2/dodona-kernel2.js
      # Each kernel's own status command, its report recomputed by the other kernel's scenario command. They run
      # even if an earlier judge failed, so one failure does not hide another, but never without the built kernel.
      - name: Judge the first kernel's status command with the project cases (decision 0034)
        if: ${{ !cancelled() && steps.build_seed.outcome == 'success' }}
        run: ${{ matrix.python }} tools/run_status_cases.py --jobs 2 --kernel node kernel2/dodona-kernel2.js -- ${{ matrix.rust_kernel }} status
      - name: Judge the second kernel's status command with the project cases (decision 0034)
        if: ${{ !cancelled() && steps.build_seed.outcome == 'success' }}
        run: ${{ matrix.python }} tools/run_status_cases.py --jobs 2 --kernel ${{ matrix.rust_kernel }} -- node kernel2/dodona-kernel2.js status
      # The reference run and status commands, both driving the first kernel, judged with the run cases; each
      # report is recomputed by the second kernel, so the kernel that ran the project does not grade it.
      - name: Judge the reference run command with the run cases (decision 0034)
        if: ${{ !cancelled() && steps.build_seed.outcome == 'success' }}
        run: ${{ matrix.python }} tools/run_run_cases.py --jobs 2 --kernel node kernel2/dodona-kernel2.js --status "${{ matrix.python }} tools/project_status.py --kernel ${{ matrix.rust_kernel }}" -- ${{ matrix.python }} tools/project_run.py --kernel ${{ matrix.rust_kernel }}

  # A kit that no defective kernel fails proves nothing. Every listed defect is
  # planted in each kernel in turn and the kit must reject it. Slow, so it has
  # its own job.
  planted-defects:
    if: github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/dodona-eight-40-c37-run-proof'
    strategy:
      fail-fast: false
      matrix:
        include:
          - kernel: first
            run: python3 tools/kit_adequacy.py
          - kernel: second
            run: node kernel2/plant.js
    name: planted defects (${{ matrix.kernel }} kernel)
    runs-on: ubuntu-26.04
    # Every planted defect is built and judged on its own. With the host judges this took 86 and 109
    # minutes on 2026-11-19; the limit leaves room for that to grow. If it does, split the list into
    # shards rather than raise the limit again.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The status judge recomputes each report with the other kernel's scenario command, so the second kernel's
      # defects need the first kernel built (the first kernel's run uses Node, which the runner has).
      - name: Build the first kernel, whose scenario command the second kernel's status judge uses
        run: cargo build --release --locked --manifest-path kernel/Cargo.toml
      - name: Plant every listed defect and check some judge rejects each
        run: ${{ matrix.run }}

  # One-off, proposed (claim C37): both kernels compared with the model's own answer on every state of the two
  # dump models, read from the lists of states that one finished run of models.yml on main kept as an artifact.
  # No model checker runs here and no state is generated: the states are the retained ones, fetched by a fixed
  # artifact id and checked against fixed digests, never "the latest". It is not a rerun on the shared queue and
  # not a cache hit. The comparison runs by manual dispatch on its disposable proof branch.
  c37-retained-states:
    name: C37 both kernels on retained model states (one-off)
    if: >-
      github.event_name == 'workflow_dispatch' && github.repository == 'sloik/dodona'
      && github.ref == 'refs/heads/dodona-eight-40-c37-run-proof'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read   # to read the retained artifact of models.yml
    env:
      SOURCE_RUN: "44626497885"
      SOURCE_SHA: c8396c4ffb5a4d65be3fa9bb3ac552905d287fcc
      ARTIFACT_ID: "14581497930"
      ARTIFACT_NAME: model-run
      ZIP_SHA256: 91f80537732663bdde8ed47ab17e7f415eb6f5311450dad683c321468e3f6fb5
      KERNEL_DUMP_SHA256: 23a548fe34db4e473a2fa80c1c66100776dde903d18cf3151d20e21cfdaad4b4
      INTENT_DUMP_SHA256: cf49fa62d922cf1f889cc116dba16bccd4a76768b3c9adc62efed7b55325bd9d
      KERNEL_STATES: "71744"
      INTENT_STATES: "78894"
      PR_HEAD: ${{ github.sha }}
    steps:
      # The dispatched commit, with the history needed to compare it with the
      # commit the retained run checked out.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: The dump models, their settings and the comparison tool are as the retained run had them
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$PR_HEAD"
          git cat-file -e "$SOURCE_SHA^{commit}" || git fetch --no-tags --quiet origin "$SOURCE_SHA"
          git diff --exit-code --stat "$SOURCE_SHA" HEAD -- spec/kernel spec/intent tools/check_states.py
      - name: Fetch the retained artifact by id, check where it came from and its digests, take out only the four files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          E="$RUNNER_TEMP/c37-evidence"; D="$RUNNER_TEMP/c37-retained"
          mkdir -p "$E" "$D"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > "$D/artifact.json"
          jq -e --arg name "$ARTIFACT_NAME" --arg run "$SOURCE_RUN" --arg sha "$SOURCE_SHA" \
            '.name == $name and .expired == false and (.workflow_run.id | tostring) == $run
             and .workflow_run.head_sha == $sha and .workflow_run.head_branch == "main"
             and .workflow_run.repository_id == .workflow_run.head_repository_id' "$D/artifact.json" > /dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > "$D/run.json"
          jq -e --arg sha "$SOURCE_SHA" --arg repo "$GITHUB_REPOSITORY" \
            '.status == "completed" and .conclusion == "success" and (.event == "push" or .event == "workflow_dispatch") and .head_branch == "main"
             and .head_sha == $sha and .head_repository.full_name == $repo and .repository.full_name == $repo
             and .path == ".github/workflows/models.yml"' "$D/run.json" > /dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$D/model-run.zip"
          echo "$ZIP_SHA256  $D/model-run.zip" | sha256sum --check --strict
          unzip -Z1 "$D/model-run.zip" > "$D/members.txt"
          for model in kernel intent; do
            mkdir -p "$D/$model"
            for file in dump.states.dump dump.exit; do
              member="out/runs/outputs/$model/$file"
              test "$(grep -cxF "$member" "$D/members.txt")" = 1
              unzip -p "$D/model-run.zip" "$member" > "$D/$model/$file"
            done
            test "$(tr -d '[:space:]' < "$D/$model/dump.exit")" = 0
          done
          echo "$KERNEL_DUMP_SHA256  $D/kernel/dump.states.dump" | sha256sum --check --strict
          echo "$INTENT_DUMP_SHA256  $D/intent/dump.states.dump" | sha256sum --check --strict
          jq -n --arg pr_head "$PR_HEAD" --arg repo "$GITHUB_REPOSITORY" --arg run "$SOURCE_RUN" --arg sha "$SOURCE_SHA" \
            --arg artifact "$ARTIFACT_ID" --arg name "$ARTIFACT_NAME" --arg zip "$ZIP_SHA256" \
            --arg kernel "$KERNEL_DUMP_SHA256" --arg intent "$INTENT_DUMP_SHA256" \
            --arg this_run "$GITHUB_RUN_ID" --arg this_attempt "$GITHUB_RUN_ATTEMPT" \
            '{compared_at: $pr_head, this_run: $this_run, this_attempt: $this_attempt,
              what: "both kernels compared with retained model states; no model checker ran and no state was generated in this job; not a rerun on the shared queue",
              source: {repository: $repo, workflow: ".github/workflows/models.yml", run: $run, commit: $sha,
                       artifact: {id: $artifact, name: $name, zip_sha256: $zip},
                       members: {"out/runs/outputs/kernel/dump.states.dump": $kernel,
                                 "out/runs/outputs/intent/dump.states.dump": $intent},
                       exit_files: {"out/runs/outputs/kernel/dump.exit": "0", "out/runs/outputs/intent/dump.exit": "0"}},
              unchanged_since_source: ["spec/kernel", "spec/intent", "tools/check_states.py"]}' > "$E/provenance.json"
      - name: Build the seed kernel
        run: cargo build --release --locked --manifest-path kernel/Cargo.toml
      - name: First kernel, evidence reuse, every retained state
        shell: bash
        run: |
          out="$RUNNER_TEMP/c37-evidence/first-kernel-evidence.txt"
          python3 tools/check_states.py --model kernel --dump "$RUNNER_TEMP/c37-retained/kernel/dump.states.dump" --settings spec/kernel/dump-settings.json -- kernel/target/release/dodona-kernel | tee "$out"
          tail -n 1 "$out" | jq -e --argjson n "$KERNEL_STATES" '.model == "kernel" and .states == $n and .differences == 0 and .all_agree == true' > /dev/null
      - name: First kernel, intent delivery, every retained state
        shell: bash
        run: |
          out="$RUNNER_TEMP/c37-evidence/first-kernel-intent.txt"
          python3 tools/check_states.py --model intent --dump "$RUNNER_TEMP/c37-retained/intent/dump.states.dump" --settings spec/intent/dump-settings.json -- kernel/target/release/dodona-kernel | tee "$out"
          tail -n 1 "$out" | jq -e --argjson n "$INTENT_STATES" '.model == "intent" and .states == $n and .differences == 0 and .all_agree == true' > /dev/null
      - name: Second kernel, evidence reuse, every retained state
        shell: bash
        run: |
          out="$RUNNER_TEMP/c37-evidence/second-kernel-evidence.txt"
          python3 tools/check_states.py --model kernel --dump "$RUNNER_TEMP/c37-retained/kernel/dump.states.dump" --settings spec/kernel/dump-settings.json -- node kernel2/dodona-kernel2.js | tee "$out"
          tail -n 1 "$out" | jq -e --argjson n "$KERNEL_STATES" '.model == "kernel" and .states == $n and .differences == 0 and .all_agree == true' > /dev/null
      - name: Second kernel, intent delivery, every retained state
        shell: bash
        run: |
          out="$RUNNER_TEMP/c37-evidence/second-kernel-intent.txt"
          python3 tools/check_states.py --model intent --dump "$RUNNER_TEMP/c37-retained/intent/dump.states.dump" --settings spec/intent/dump-settings.json -- node kernel2/dodona-kernel2.js | tee "$out"
          tail -n 1 "$out" | jq -e --argjson n "$INTENT_STATES" '.model == "intent" and .states == $n and .differences == 0 and .all_agree == true' > /dev/null
      # Reached only when all four comparisons above exited 0 with every state in agreement.
      - name: Record the commit, the digest of every input file of both kernels, the built kernel and the tool versions
        shell: bash
        run: |
          E="$RUNNER_TEMP/c37-evidence"
          git rev-parse HEAD > "$E/head.txt"
          git ls-files -z -- kernel kernel2 spec/kernel spec/intent tools/check_states.py | xargs -0 sha256sum > "$E/input-files.sha256"
          sha256sum kernel/target/release/dodona-kernel > "$E/built-kernel.sha256"
          { rustc --version; cargo --version; node --version; python3 --version; } > "$E/tool-versions.txt"
          echo "all four comparisons agreed on every retained state" > "$E/complete.txt"
      # The results and digests only: the lists of states stay out, and nothing here holds a token.
      - name: Keep the comparison results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: c37-retained-states-comparison
          path: ${{ runner.temp }}/c37-evidence
          if-no-files-found: error
          retention-days: 90
