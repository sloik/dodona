name: Repository checks
# Checks that need no model checker: files parse, links resolve, every model
# case has an expected outcome, and the judge never turns an unfinished run
# into a match. Runs on all three platforms dodona supports.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            python: python3
          - os: ubuntu-24.04
            python: python3
          - os: windows-2025
            python: python
    runs-on: ${{ matrix.os }}
    # The run itself takes seconds. The allowance is for waiting on a hosted
    # machine, which for macOS can be long.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run repository checks
        run: ${{ matrix.python }} tools/check_repo.py
