name: Model checks
# Runs every case in spec/*/expected.json through the project's own executor
# and fails unless each one produced exactly its expected outcome. A case that
# did not finish is a failure, never a pass.
#
# This runs only on the maintained main branch, on the project's own runner.
# It never runs for pull requests: code from a fork must not execute there.
# The job is skipped until the repository variable MODEL_RUNNER is "ready".
on:
  push:
    branches: [main]
    # Records of runs and the claims table are not inputs to a run; changing them
    # must not start another one on the shared queue.
    paths: ["spec/**", "!spec/runs/**", "!spec/CLAIMS.md", "!spec/README.md", "tools/check_models.py", "tools/check_states.py", "tools/host.py", "tools/status.py", "providers/**", "dodona.lock", "kernel/**", ".github/site/**", ".github/workflows/models.yml"]
  workflow_dispatch:
permissions:
  contents: read
# A newer push waits for the run in progress. Cancelling would leave its jobs
# behind on the shared queue.
concurrency:
  group: models-main
  cancel-in-progress: false
jobs:
  models:
    if: github.repository == 'sloik/dodona' && github.ref == 'refs/heads/main' && vars.MODEL_RUNNER == 'ready'
    runs-on: [self-hosted, Linux, ARM64, oracle, dodona]
    # Long, because the shared queue may be busy with other projects' work.
    timeout-minutes: 720
    steps:
      - name: Checkout maintained main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run repository checks
        run: python3 tools/check_repo.py
      # One job on the shared queue for everything. The provider says what to
      # run, the executor runs it, and what came back is saved as files.
      - name: Have the provider describe every check and the executor run them
        run: python3 tools/host.py collect --site .github/site/executor.json --out out/runs --dumps
      - name: Judge every model case
        run: python3 tools/check_models.py --replay out/runs/outputs --report model-report.json
      - name: Keep the report, the raw outputs and the lists of states
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: model-run
          path: |
            model-report.json
            out/runs
          if-no-files-found: warn

  # The model checker wrote out every state the two dump models reached, each
  # with the model's own answer. The kernel must give that answer for every one.
  # This job builds the kernel, so it runs on a hosted machine; it executes no
  # model checker.
  kernel-on-every-state:
    needs: models
    # Also when the cases did not all match or the executor could not be
    # reached: then that is what gets recorded.
    if: always() && needs.models.result != 'skipped' && needs.models.result != 'cancelled'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: model-run
      - name: Build the seed kernel
        run: cargo build --release --locked --manifest-path kernel/Cargo.toml
      - name: Evidence reuse, every state
        run: python3 tools/check_states.py --model kernel --dump out/runs/outputs/kernel/dump.states.dump --settings spec/kernel/dump-settings.json -- kernel/target/release/dodona-kernel
      - name: Intent delivery, every state
        run: python3 tools/check_states.py --model intent --dump out/runs/outputs/intent/dump.states.dump --settings spec/intent/dump-settings.json -- kernel/target/release/dodona-kernel
      # dodona used on dodona: the provider reads what the runs printed, the
      # kernel writes each verdict to a ledger and works out the status of this
      # project from it. A run that did not happen is recorded as unavailable.
      - name: Record every verdict in a ledger
        if: always()
        run: python3 tools/host.py conclude --runs out/runs --ledger out/dodona.ledger --writer ci --kernel kernel/target/release/dodona-kernel
      - name: Status of this project, worked out by the kernel
        if: always()
        run: |
          git fetch --quiet --depth 1 origin main
          python3 tools/status.py --ledger out/dodona.ledger --writer ci --kernel kernel/target/release/dodona-kernel | tee out/status.txt
          python3 tools/status.py --ledger out/dodona.ledger --writer ci --json --kernel kernel/target/release/dodona-kernel > out/status.json
          { echo '### Status of dodona, worked out by its own kernel'; echo; echo '```'; cat out/status.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Validate every message of both provider sessions against the schemas
        if: always()
        run: |
          python3 -m venv .venv-examples
          .venv-examples/bin/python -m pip install --quiet jsonschema==4.26.0
          .venv-examples/bin/python tools/check_transcript.py out/runs/transcript-collect.json out/runs/transcript-conclude.json
      - name: Keep the ledger, the status and the sessions
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dodona-on-dodona
          path: |
            out/dodona.ledger
            out/status.txt
            out/status.json
            out/runs/transcript-collect.json
            out/runs/transcript-conclude.json
            out/runs/runs.json
          if-no-files-found: warn
