name: Model checks
# Runs every case in spec/*/expected.json through the project's own executor
# and fails unless each one produced exactly its expected outcome. A case that
# did not finish is a failure, never a pass.
#
# This runs only on the maintained main branch, on the project's own runner.
# It never runs for pull requests: code from a fork must not execute there.
# The job is skipped until the repository variable MODEL_RUNNER is "ready".
on:
  push:
    branches: [main]
    paths: ["spec/**", "tools/**", ".github/site/**", ".github/workflows/models.yml"]
  workflow_dispatch:
permissions:
  contents: read
# A newer push waits for the run in progress. Cancelling would leave its jobs
# behind on the shared queue.
concurrency:
  group: models-main
  cancel-in-progress: false
jobs:
  models:
    if: github.repository == 'sloik/dodona' && github.ref == 'refs/heads/main' && vars.MODEL_RUNNER == 'ready'
    runs-on: [self-hosted, Linux, ARM64, oracle, dodona]
    # Long, because the shared queue may be busy with other projects' work.
    timeout-minutes: 720
    steps:
      - name: Checkout maintained main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run repository checks
        run: python3 tools/check_repo.py
      - name: Run and judge every model case
        run: python3 tools/check_models.py --site .github/site/executor.json --batch --dumps --save model-outputs --report model-report.json
      - name: Keep the report, the raw outputs and the lists of states
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: model-run
          path: |
            model-report.json
            model-outputs
          if-no-files-found: warn

  # The model checker wrote out every state the two dump models reached, each
  # with the model's own answer. The kernel must give that answer for every one.
  # This job builds the kernel, so it runs on a hosted machine; it executes no
  # model checker.
  kernel-on-every-state:
    needs: models
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: model-run
      - name: Build the seed kernel
        run: cargo build --release --locked --manifest-path kernel/Cargo.toml
      - name: Evidence reuse, every state
        run: python3 tools/check_states.py --model kernel --dump model-outputs/kernel/dump.states.dump --settings spec/kernel/dump-settings.json -- kernel/target/release/dodona-kernel
      - name: Intent delivery, every state
        run: python3 tools/check_states.py --model intent --dump model-outputs/intent/dump.states.dump --settings spec/intent/dump-settings.json -- kernel/target/release/dodona-kernel
