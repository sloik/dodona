name: Documents follow the code
# A change to code must change the documents that describe it, or say in a
# commit message why none has to (tools/check_docs.py, docs/gap-checks.md). A
# pull request's description must also say what was verified and what was not.
# The repository-wide document checks run in checks.yml on every platform; this
# judges one change, so it needs the history and runs once. It is apart from
# checks.yml so that editing a description re-runs only this.
#
# The change is judged by the base's copy of tools/check_docs.py, checked out
# beside it, so that a change cannot loosen the checker that judges it. Only
# the change that first brings the checker is judged by its own copy.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-${{ github.ref }}
  # A push to main is never cancelled unjudged by the next one.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  change:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Values from the event reach the commands through the environment only.
      # The description is copied from the event file by Python, never through the shell.
      - name: Judge the change with the base's checker
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          case "$EVENT" in
            pull_request) BASE="$PR_BASE"; HEAD="$PR_HEAD" ;;
            push) BASE="$PUSH_BEFORE"; HEAD="$PUSH_AFTER" ;;
            *) BASE="$(git rev-parse origin/main)"; HEAD="$(git rev-parse HEAD)" ;;
          esac
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "The base $BASE is not in the history: main was force-pushed, or the base is unknown. This change cannot be judged here; judge it by hand."
            exit 1
          fi
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE"
          CHECKER="$RUNNER_TEMP/base/tools/check_docs.py"
          if [ ! -f "$CHECKER" ]; then
            echo "The base has no tools/check_docs.py: this change brings the checker and is judged by its own copy, which a reviewer must read."
            CHECKER=tools/check_docs.py
          fi
          # An automatic update that only moves pinned actions or runner images is judged by checks.yml alone.
          # The author is not trusted on its own: the checker reads the change and must find nothing else in it.
          if [ "$EVENT" = pull_request ] && [ "$PR_AUTHOR" = "renovate[bot]" ] \
             && python3 "$CHECKER" pins-only --repo . --base "$BASE" --head "$HEAD"; then
            echo "Not judged for documents: an automatic update of pinned versions only."
            exit 0
          fi
          if [ "$EVENT" = pull_request ]; then
            python3 -c "import json, os, sys; sys.stdout.write(json.load(open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8'))['pull_request'].get('body') or '')" > "$RUNNER_TEMP/pr-body.md"
            python3 "$CHECKER" diff --repo . --base "$BASE" --head "$HEAD" --pr-body "$RUNNER_TEMP/pr-body.md"
          else
            python3 "$CHECKER" diff --repo . --base "$BASE" --head "$HEAD"
          fi
