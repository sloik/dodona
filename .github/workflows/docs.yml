name: Documents follow the code
# A change to code must change the documents that describe it, or say in a
# commit message why none has to (tools/check_docs.py, docs/gap-checks.md). A
# pull request's description must also say what was verified and what was not.
# The repository-wide document checks run in checks.yml on every platform; this
# judges one change, so it needs the history and runs once. It is apart from
# checks.yml so that editing a description re-runs only this.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  change:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Values from the event reach the commands through the environment only.
      # The description is copied from the event file by Python, never through the shell.
      - name: Judge the pull request against its base
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 -c "import json, os, sys; sys.stdout.write(json.load(open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8'))['pull_request'].get('body') or '')" > "$RUNNER_TEMP/pr-body.md"
          python3 tools/check_docs.py diff --base "$BASE" --head "$HEAD" --pr-body "$RUNNER_TEMP/pr-body.md"
      - name: Judge the push against what main was before it
        if: github.event_name == 'push'
        env:
          BASE: ${{ github.event.before }}
          HEAD: ${{ github.sha }}
        run: python3 tools/check_docs.py diff --base "$BASE" --head "$HEAD"
      - name: Judge the branch against main
        if: github.event_name == 'workflow_dispatch'
        run: python3 tools/check_docs.py diff --base origin/main --head HEAD
